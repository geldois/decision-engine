[project]
name = "decision-engine"
version = "1.0.0"
description = "Deterministic rule engine with full execution traceability"
requires-python = ">=3.12"
dependencies = [
  "alembic",
  "fastapi",
  "psycopg[binary]",
  "python-dotenv",
  "sqlalchemy",
  "structlog",
  "typer",
  "uvicorn"
]

[project.scripts]
decision-engine = "decision_engine.interface.cli.cli:cli"

[dependency-groups]
dev = [
  "basedpyright",
  "commitizen",
  "httpx",
  "pre-commit",
  "pytest",
  "ruff"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonPlatform = "All"
reportMissingTypeStubs = "none"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_map_pyproject = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "D100", "D101", "D203", "D212", "ISC001", "RUF012"]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
