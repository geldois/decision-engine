name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENV: test
      DB_PREFIX: postgresql+psycopg
      DB_USER: user
      DB_PASS: pass
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: decision_engine_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: decision_engine_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Wait for database
        run: uv run decision-engine wait-db

      - name: Test
        run: uv run pytest

      - name: Validate migrations
        run: uv run alembic upgrade head
