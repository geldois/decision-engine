services:
  postgres:
    image: postgres:16
    container_name: decision-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: decision_engine
    ports:
      - "5432:5432"
    volumes:
      - decision-engine-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d decision_engine"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  decision-engine-postgres-data:
