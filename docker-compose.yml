services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: decision_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d decision_engine" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  test:
    build: .
    command: uv run pytest
    environment:
      DB_PREFIX: postgresql+psycopg
      DB_USER: user
      DB_PASS: pass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: decision_engine_test
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      PERSISTENCE: postgresql
      DB_PREFIX: postgresql+psycopg
      DB_USER: user
      DB_PASS: pass
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: decision_engine_dev
    depends_on:
      postgres:
        condition: service_healthy
      test:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  postgres_data:
